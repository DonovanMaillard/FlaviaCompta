{% extends 'main.html' %}


{% block content %}
<div class="container">
<h1> Bilans par année</h1>

<table class="table">
	<thead>
		<tr>
			<th>Année disponibles</th>
			<th>Télécharger le rapport</th>
			<th>Télécharger toutes les opérations</th>
		</tr>
	</thead>
	<tbody>
		{% for year in years %}
		<tr>
			<td>{{ year.year }}</td>
			<td><a class="btn btn-success btn-right " href="{{url_for('results.resultsPDF', year=year.year)}}"><i class="fa fa-download"> </i> Bilan PDF </a></td>
			<td><a class="btn btn-success btn-right " href="{{url_for('operations.download_operations', date_apres=year.year ~ '-01-01', date_avant=year.year ~ '-12-31')}}"><i class="fa fa-download"> </i> Opérations format tableur </a></td>
		</tr>
		{% endfor %}
	</tbody>
</table>
</div>
{% endblock %}
